<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREN — Add products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#070707;--bone:#efece4;--smoke:#9b968c;--edge:#26251f;--ok:#1faa54;--bad:#c0554a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--bone);font-family:'Chivo Mono',monospace;font-weight:300;
     padding:26px 20px 70px;max-width:560px;margin:0 auto;line-height:1.6}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.sub{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--smoke);margin:6px 0 26px}
label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--smoke);margin-bottom:16px}
input[type=text],input[type=number],input[type=password]{
  width:100%;margin-top:7px;background:#121211;border:1px solid var(--edge);color:var(--bone);
  font-family:inherit;font-size:16px;padding:12px;letter-spacing:0;text-transform:none}
input:focus{outline:none;border-color:var(--bone)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:1px solid var(--edge);padding:12px 14px;margin-bottom:16px}
legend{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);padding:0 6px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes label{display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:0;text-transform:none;
  color:var(--bone);margin:4px 0;border:1px solid var(--edge);padding:9px 13px;cursor:pointer}
.sizes input{accent-color:var(--bone);width:16px;height:16px}
.pick{border:1px dashed #3a382f;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px}
.pick:hover{border-color:var(--bone)}
.pick span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.pick img{max-width:100%;max-height:190px;margin-top:10px;display:block;margin-inline:auto}
input[type=file]{display:none}
button{width:100%;background:var(--bone);color:var(--void);border:0;cursor:pointer;
  font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  padding:17px 0;margin-top:10px}
button:disabled{opacity:.45;cursor:default}
.msg{margin-top:16px;font-size:13px;padding:13px;border:1px solid var(--edge);display:none}
.msg.show{display:block}
.msg.good{border-color:var(--ok);color:#8ee0ad}
.msg.bad{border-color:var(--bad);color:#e59b91}
.list{margin-top:36px;border-top:1px solid var(--edge);padding-top:22px}
.list h2{font-family:'Anton',sans-serif;font-weight:400;font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--edge)}
.item img{width:44px;height:58px;object-fit:cover;background:#161614}
.item .n{flex:1;font-size:13px}
.item small{display:block;color:var(--smoke);font-size:11px;margin-top:2px}
.item button{width:auto;background:none;border:1px solid var(--edge);color:var(--smoke);
  font-size:10px;padding:7px 11px;margin:0}
.item button:hover{color:var(--bad);border-color:var(--bad)}
.hint{font-size:11px;color:var(--smoke);line-height:1.8;margin-top:8px}
#gate{margin-bottom:30px}
#main{display:none}
</style>
</head>
<body>

<h1>AUREN</h1>
<p class="sub">Add a product</p>

<div id="gate">
  <label>Passcode<input type="password" id="pin" autocomplete="current-password"></label>
  <button id="unlock">Unlock</button>
  <p class="hint">Ask Abid for the passcode. It's saved on this phone after the first time.</p>
</div>

<div id="main">
  <label>Product name<input type="text" id="pName" placeholder="e.g. Vice City"></label>
  <label>Colour<input type="text" id="pColour" placeholder="e.g. Washed Black"></label>

  <div class="two">
    <label>MRP ₹<input type="number" id="pMrp" inputmode="numeric" placeholder="625"></label>
    <label>Selling price ₹<input type="number" id="pPrice" inputmode="numeric" placeholder="499"></label>
  </div>

  <fieldset>
    <legend>Sizes in stock</legend>
    <div class="sizes">
      <label><input type="checkbox" class="szbox" value="M" checked> M</label>
      <label><input type="checkbox" class="szbox" value="L" checked> L</label>
      <label><input type="checkbox" class="szbox" value="XL" checked> XL</label>
      <label><input type="checkbox" class="szbox" value="XXL" checked> XXL</label>
    </div>
  </fieldset>

  <div class="pick" id="pickFront">
    <span>Tap to choose FRONT photo</span>
    <img id="prevFront" hidden alt="">
  </div>
  <input type="file" id="fileFront" accept="image/*">

  <div class="pick" id="pickBack">
    <span>Tap to choose BACK photo</span>
    <img id="prevBack" hidden alt="">
  </div>
  <input type="file" id="fileBack" accept="image/*">

  <button id="publish">Publish to website</button>
  <div class="msg" id="msg"></div>
  <p class="hint">Photos are resized automatically. After publishing, refresh aurenofficial.in to see it.</p>

  <div class="list">
    <h2>Live on the site</h2>
    <div id="items"><p class="hint">Loading…</p></div>
  </div>
</div>

<script>
/* ---- set this to the Apps Script /exec URL ---- */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwv3PQrekrdnlz2Dz_kp98RgF7deJfOcexui4ayckEq9jwSuf4Xy-GtePpolHBgts2IfQ/exec";

const $ = s => document.querySelector(s);
let pin = localStorage.getItem('aurenPin') || '';
let frontData = '', backData = '';

if (pin){ $('#gate').style.display='none'; $('#main').style.display='block'; loadList(); }

$('#unlock').onclick = () => {
  pin = $('#pin').value.trim();
  if (!pin) return;
  localStorage.setItem('aurenPin', pin);
  $('#gate').style.display='none'; $('#main').style.display='block';
  loadList();
};

/* ---- photo pickers, with automatic downscaling ---- */
function wirePicker(pickSel, fileSel, prevSel, set){
  $(pickSel).onclick = () => $(fileSel).click();
  $(fileSel).onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const max = 900;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.78);
      set(data);
      const p = $(prevSel); p.src = data; p.hidden = false;
      $(pickSel).querySelector('span').textContent = 'Photo chosen — tap to change';
    };
    img.src = URL.createObjectURL(f);
  };
}
wirePicker('#pickFront', '#fileFront', '#prevFront', d => frontData = d);
wirePicker('#pickBack',  '#fileBack',  '#prevBack',  d => backData  = d);

function say(text, good){
  const m = $('#msg');
  m.textContent = text;
  m.className = 'msg show ' + (good ? 'good' : 'bad');
}

/* ---- publish ---- */
$('#publish').onclick = async () => {
  const name   = $('#pName').value.trim();
  const colour = $('#pColour').value.trim();
  const mrp    = $('#pMrp').value;
  const price  = $('#pPrice').value;
  const sizes  = [...document.querySelectorAll('.szbox:checked')].map(b => b.value).join(', ');

  if (!name || !colour || !price){ say('Fill in name, colour and price.', false); return; }
  if (!frontData && !backData){ say('Choose at least one photo.', false); return; }
  if (!sizes){ say('Tick at least one size.', false); return; }

  $('#publish').disabled = true;
  $('#publish').textContent = 'Publishing…';
  say('Uploading photos, this can take a few seconds…', true);

  const body = new URLSearchParams({
    action:'addProduct', pin,
    name, colour, mrp: mrp || price, price, sizes,
    frontData, backData
  });

  try {
    await fetch(ENDPOINT, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body });
  } catch(e){}

  // confirm by re-reading the catalogue
  setTimeout(async () => {
    const list = await getCatalog();
    const added = list.some(p => p.name === name && p.colour === colour);
    $('#publish').disabled = false;
    $('#publish').textContent = 'Publish to website';
    if (added){
      say('Published. It is live on the website now.', true);
      $('#pName').value=''; $('#pColour').value=''; $('#pMrp').value=''; $('#pPrice').value='';
      frontData=''; backData='';
      ['#prevFront','#prevBack'].forEach(s => $(s).hidden = true);
      $('#pickFront').querySelector('span').textContent = 'Tap to choose FRONT photo';
      $('#pickBack').querySelector('span').textContent  = 'Tap to choose BACK photo';
      render(list);
    } else {
      say('Could not confirm it saved. Check the passcode, then try again.', false);
    }
  }, 3500);
};

/* ---- catalogue via JSONP (no CORS headaches) ---- */
function getCatalog(){
  return new Promise(resolve => {
    const cb = 'cb' + Date.now();
    window[cb] = data => { resolve((data && data.products) || []); delete window[cb]; s.remove(); };
    const s = document.createElement('script');
    s.src = ENDPOINT + '?action=catalog&callback=' + cb + '&t=' + Date.now();
    s.onerror = () => { resolve([]); s.remove(); };
    document.body.appendChild(s);
  });
}

async function loadList(){ render(await getCatalog()); }

function render(list){
  const box = $('#items');
  if (!list.length){ box.innerHTML = '<p class="hint">Nothing added yet.</p>'; return; }
  box.innerHTML = list.map(p =>
    '<div class="item"><img src="' + (p.back || p.front) + '" alt="">' +
    '<div class="n">' + p.name + '<small>' + p.colour + ' · ₹' + p.price + ' · ' + p.sizes.join('/') + '</small></div>' +
    '<button data-id="' + p.id + '">Remove</button></div>').join('');

  box.querySelectorAll('button').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this from the website?')) return;
    b.textContent = '…';
    try {
      await fetch(ENDPOINT, { method:'POST', mode:'no-cors',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body: new URLSearchParams({ action:'removeProduct', pin, id: b.dataset.id }) });
    } catch(e){}
    setTimeout(loadList, 2500);
  });
}
</script>
</body>
</html>
